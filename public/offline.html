<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#044272" />
    <title>You're offline | DoLearnn</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f9fafb;
        color: #0b1f33;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        border-radius: 28px;
        background: #044272;
        color: #fff;
        padding: 28px 24px;
        text-align: center;
      }
      img { width: 56px; height: 56px; border-radius: 14px; background: #fff; padding: 6px; }
      h1 { margin: 16px 0 8px; font-size: 24px; }
      p { margin: 0; line-height: 1.5; color: rgba(255, 255, 255, 0.8); }
      button {
        margin-top: 22px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 16px;
        background: #54cd98;
        color: #022a49;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0c1521; color: #f1f5f9; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="DoLearnn" />
      <h1>You're offline</h1>
      <p>Check your data or Wi-Fi, then try again. Any quiz answers you already gave are saved on this phone.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
